version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: pt_repo_manager_db
    restart: always
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      POSTGRES_DB: ${DATABASE_NAME:-pt_repo_manager}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres} -d ${DATABASE_NAME:-pt_repo_manager}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
